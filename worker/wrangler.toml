# Cloudflare Worker: Goch, das Rotkehlchen von Robin – LLM-Proxy und Draht zu Robin.
# Deploy:  cd worker && npx wrangler login && npx wrangler deploy
# Der Schlüssel liegt nie im Seitencode. Anbieter per PROVIDER umschalten.
name = "rjl-goch"
# Kein __name-Helfer von esbuild: makeRenderer() aus blog.js wird als Quelltext in die Redaktionsseite eingebettet.
keep_names = false
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# Eigene Adresse für Goch (21.09.2026): Cloudflare legt DNS-Eintrag und Zertifikat selbst an. workers.dev bleibt erreichbar.
# (Top-Level-Schlüssel müssen vor der ersten [Tabelle] stehen.)
routes = [{ pattern = "goch.robin.vision", custom_domain = true }]
workers_dev = true                   # rjl-goch.rjl.workers.dev bleibt erreichbar (Übergang, Redaktion, alte Verweise)
preview_urls = false                 # keine öffentlichen Versions-Adressen

[ai]
binding = "AI"                       # Workers AI (Free-Kontingent, Start)

[vars]
PROVIDER = "anthropic"               # "anthropic" (Claude, Secret ANTHROPIC_API_KEY) | "workers-ai" (Cloudflare, kostenlos, 10.000 Neuronen/Tag)
MODEL = "claude-opus-5-5"            # Robin, 25.09.2026: Opus 5.5 (Nachfolger von Opus 5, günstiger; Aufruf unverändert kompatibel). Cloudflare: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# Secret setzen: npx wrangler secret put ANTHROPIC_API_KEY
ALLOWED_ORIGINS = "https://robin.vision,https://www.robin.vision,https://robinjameslewis-star.github.io,http://localhost:8788"  # eigene Domain seit 21.09.2026; github.io leitet dorthin um
MAX_PER_IP_PER_HOUR = "12"           # weiche Grenze je Besucher (pro Worker-Instanz)
MAX_PER_DAY = "60"                   # harte Tagesgrenze über KV (Zähler USAGE) – Kostenbremse, Robin 17.09.2026
MAX_INPUT_CHARS = "600"
MAX_TURNS = "10"                     # Antworten des Modells je Gespräch; danach nur noch der Draht (ohne Modell)
MAX_MESSAGES_PER_IP_PER_DAY = "3"    # Nachrichten an Robin je Besucher und Tag
MAX_CONTACT_PER_DAY = "30"  # Kontaktformular: Nachrichten je Tag insgesamt
MAX_DRAHT_PER_DAY = "20"    # Goch: Nachrichten an Robin je Tag insgesamt (Review 25.09.2026)
MAX_AUFBAU_PER_DAY = "20"   # Werkzeug „Kontoauszug-Konverter“: Aufbau-Meldungen je Tag insgesamt (src/aufbau.js)
# Lizenzen SmartFormular ab 01.01.2027 (src/lizenz.js): Code per E-Mail, Test vier Wochen, Lizenz ein Jahr je Person.
# Stripe (später, Robin): Secrets STRIPE_SECRET_KEY und STRIPE_WEBHOOK_SECRET; Preis-IDs als STRIPE_PREIS_ERECHNUNG / STRIPE_PREIS_FIBU.
# Ohne Stripe und mit LIZENZ_TESTKAUF = "1" schaltet „Lizenz kaufen“ sofort frei (nur zum Durchspielen, nie öffentlich an).
LIZENZ_PREIS = ""                  # Text im Werkzeug neben „Lizenz kaufen“, z. B. "199 € je Benutzer und Jahr" – erst, wenn der Preis auf der Website steht
LIZENZ_TESTKAUF = "0"
LIZENZ_GERAETE = "3"               # angemeldete Geräte je Person
MAX_LIZENZ_CODES_PER_DAY = "300"   # Anmeldecodes je Tag insgesamt (Kostenbremse Resend)
# Sprechender Goch (23.10.2026): Spracheingabe POST /listen über Workers AI (Whisper large-v3-turbo, Bindung AI),
# Stimme über ElevenLabs. Schalter, Modell des Sprachmodus, voiceId und Grenzen in der Redaktion – beides ist aus,
# bis Robin einschaltet; hier nur die Ausgangswerte der Grenzen.
# Secret: npx wrangler secret put ELEVENLABS_API_KEY
MAX_STIMME_ZEICHEN_MONAT = "30000"   # vertonte Zeichen je Monat (Kostenbremse; danach nur Text, ohne Hinweis an Besucher)
MAX_HOEREN_MINUTEN_TAG = "20"        # Audiominuten Spracheingabe je Tag
MAX_HOEREN_PER_IP_PER_HOUR = "30"    # Aufnahmen je Besucher und Stunde (pro Worker-Instanz)
SPRACH_MODEL = "claude-haiku-5-5"    # Ausgangswert für das schnellere Modell im Sprachmodus
MAX_HOEREN_ANFRAGEN_TAG = "400"     # zweiter Deckel der Spracheingabe: Aufnahmen je Tag (Prüfung 29.10.2026, Befund 4.1)
# Messegerät (23.10.2026): Kiosk-Route /kiosk/* mit Gerätenachweis aus der Redaktion („Messegeräte“). „an“ verlangt
# zusätzlich ein Cloudflare-Client-Zertifikat (API Shield → mTLS für goch.robin.vision, im Dashboard einzurichten).
KIOSK_MTLS = "aus"
# Eingang „Workshop“ für den Memberbereich (src/workshop.js): ohne Kopf X-Workshop-Budget ein Tagesbudget („memberbereich“),
# mit Kopf ein Budget je Termin über die ganze Laufzeit. Vorgaben stehen im Code; zum Ändern hier eintragen (ganze Zahlen):
# WORKSHOP_ANTWORTEN_TAG = "600"            # Tagesbudget ohne Kopf: Antworten
# WORKSHOP_MINUTEN_TAG = "60"               # Tagesbudget ohne Kopf: Minuten Spracheingabe
# WORKSHOP_TERMIN_ANTWORTEN = "150"         # je Termin, wenn der Kopf keinen Wert nennt
# WORKSHOP_TERMIN_MINUTEN = "15"
# WORKSHOP_TERMIN_ZEICHEN = "40000"         # vertonte Zeichen je Termin
# WORKSHOP_TERMIN_MAX_ANTWORTEN = "400"     # Obergrenzen je Termin, gelten auch für Werte aus dem Kopf
# WORKSHOP_TERMIN_MAX_MINUTEN = "60"
# WORKSHOP_TERMIN_MAX_ZEICHEN = "150000"
# WORKSHOP_TERMINE_TAG_ANTWORTEN = "1000"   # Summe über alle Termine je Tag
# WORKSHOP_TERMINE_TAG_ZEICHEN = "300000"
# Newsletter „Impulse und Werkzeuge“ über Brevo (src/newsletter.js). Aus, solange das Secret fehlt. Einrichten: siehe README, Abschnitt Newsletter.
# Secret: npx wrangler secret put BREVO_API_KEY
BREVO_LISTE_DE = "3"         # ID der Liste „Newsletter DE“ in Brevo (angelegt 15.10.2026)
BREVO_LISTE_EN = "4"         # ID der Liste „Newsletter EN“ (leer: alle in die deutsche Liste)
BREVO_DOI_VORLAGE_DE = "1"   # ID der Vorlage „Newsletter Bestätigung DE (Double-Opt-In)“
BREVO_DOI_VORLAGE_EN = "2"   # ID der Vorlage „Newsletter Bestätigung EN (Double-Opt-In)“
NEWSLETTER_BESTAETIGT_URL = "https://robin.vision/?newsletter=bestaetigt#newsletter"
MAX_NEWSLETTER_PER_DAY = "100"
# Der Draht: Versand über Resend. Secret: npx wrangler secret put RESEND_API_KEY
MAIL_TO = "robin@robin.vision"
MAIL_FROM = "Goch <goch@robin.vision>"  # Absenderdomain robin.vision bei Resend verifiziert (21.09.2026; DKIM/SPF/DMARC im Cloudflare-DNS)
GITHUB_REPO = "robinjameslewis-star/rjl-visitenkarte"  # Speicher des Dashboards; Schlüssel: Geheimnis GITHUB_TOKEN
GITHUB_BRANCH = "main"
CHAT_ENDPOINT = "https://goch.robin.vision/chat"  # trägt die Redaktion beim Einschalten wieder in index.html ein
SITE_URL = "https://robin.vision/"  # eigene Domain seit 21.09.2026 (GitHub Pages, CNAME); für Blog-Verweise, RSS, Vorschau in der Redaktion

# Tageszähler für MAX_PER_DAY (angelegt 17.09.2026 mit: npx wrangler kv namespace create USAGE)
[[kv_namespaces]]
binding = "USAGE"
id = "46e7ba80286c4ed1b701bb0c2fd3af30"

# Messegerät: Tagesbudget je Gerät (Antworten, Sekunden Spracheingabe) als Durable Object (src/kiosk.js, Klasse Geraetebudget).
# Wird mit dem nächsten Deploy angelegt (SQLite-Speicher, auch im kostenlosen Tarif).
[[durable_objects.bindings]]
name = "GERAETE"
class_name = "Geraetebudget"

[[migrations]]
tag = "v1-geraetebudget"
new_sqlite_classes = ["Geraetebudget"]

# Anfragengrenze für die Anmeldung der Redaktion: 10 je Minute und Adresse, gezählt von Cloudflare ohne KV
# (sonst könnte ein Skript mit Challenges das Schreibkontingent des KV aufbrauchen). Review 25.09.2026.
[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "2509"
simple = { limit = 10, period = 60 }

# Anfragen je Adresse und Minute an /chat und /listen (Sicherheitsprüfung 11.11.2026, M3): zählt über alle Instanzen eines
# Standorts, anders als die weichen Grenzen je Instanz (MAX_PER_IP_PER_HOUR, MAX_HOEREN_PER_IP_PER_HOUR).
[[ratelimits]]
name = "GOCH_IP_LIMIT"
namespace_id = "2511"
simple = { limit = 10, period = 60 }

[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true
